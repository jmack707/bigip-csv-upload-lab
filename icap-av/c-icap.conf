# c-icap for the CSV lab. One job: scan what the BIG-IP sends and say CLEAN or INFECTED.
PidFile /run/c-icap/c-icap.pid
CommandsSocket /run/c-icap/c-icap.ctl
Port 1344
Timeout 60
MaxKeepAliveRequests 100
KeepAliveTimeout 60
StartServers 2
MaxServers 4
MinSpareThreads 4
MaxSpareThreads 8
ThreadsPerChild 8
MaxRequestsPerChild 0
ServerName csv-lab-icap-av
TmpDir /tmp
MaxMemObject 2097152
DebugLevel 1
Pipelining on
SupportBuggyClients off
ModulesDir /usr/lib/x86_64-linux-gnu/c_icap
ServicesDir /usr/lib/x86_64-linux-gnu/c_icap
TemplateDir /usr/share/c_icap/templates/
TemplateDefaultLanguage en
LoadMagicFile /etc/c-icap/c-icap.magic
RemoteProxyUsers off

# One line per ICAP transaction: time, client, method, service, ICAP status, bytes in, action, virus name.
LogFormat labFormat "%tl %a %im %iu %is in=%Ib action=%{virus_scan:action}Sa virus=%{virus_scan:virus}Sa"
ServerLog /var/log/c-icap/server.log
AccessLog /var/log/c-icap/access.log labFormat

# ClamAV engine in-process (libclamav). Signatures from the libclamav default directory, /var/lib/clamav.
Module common clamav_mod.so
clamav_mod.MaxScanSize 4M
clamav_mod.MaxRecLevel 4
clamav_mod.MaxFilesInArchive 100

Service antivirus_module virus_scan.so
# The lab never sends more than 1.25 MiB; scan every type, never pass data through early.
virus_scan.ScanFileTypes TEXT DATA EXECUTABLE ARCHIVE GIF JPEG MSOFFICE
virus_scan.SendPercentData 0
virus_scan.MaxObjectSize 2M
virus_scan.DefaultEngine clamav
# BIG-IP Advanced WAF calls icap://host:1344/reqmod (ASM internal parameter icap_uri).
ServiceAlias reqmod virus_scan?allow204=on&sizelimit=off&mode=simple
ServiceAlias avscan virus_scan?allow204=on&sizelimit=off&mode=simple
